name = "plainhand-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://rounak251.github.io"
QUOTA = "150"

# Create with: npx wrangler kv namespace create LICENSES   (paste the id below)
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_ID"
